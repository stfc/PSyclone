# This file controls which files are being processed by PSyclone,
# both using PSyclone's transmute ability (transformation generic
# Fortran files), and its DSL (kernel based) capability.

# First we specify the phases for PSyclone. This allows
# any apps to run transmute and DSL steps in any order just by
# changing (or supplying a different) PSyclone-info file.
# In this file, we only run a single DSL phase.

phases:
  # Just a single phase: running PSyclone in DSL mode
  - dsl

dsl:
  comment: "PSylone DSL Phase"
  api: lfric
  script_dir: "cpu/psykal"
  file_pattern: "*x90"

  # Optional: determines the output file for each source file. Valid
  # variables are {rel_path} (directory of the source file relative to the
  # input path), {stem}, {suffix} and {name}. This default keeps the
  # relative path and the name. Using e.g. "{name}" would write all files
  # into the output directory, and "{rel_path}/{stem}.new{suffix}" would
  # turn test.f90 into test.new.f90.
  output_template: "{rel_path}/{name}"

  # The rules are applied in the order given, and the last matching rule
  # wins. Each rule is either a script (`- script: name`), or one of the
  # special rules `exclude`, `no_script` or `file_specific`.
  rules:
    # These two directives reproduce the current LFRic default PSyclone
    # triggering:

    # Run optimisation/.../global.py on all x90 files (x90 because this is
    # the dsl section, as specified in the artefacts above)
    - script: global.py
      params:
        offload: True
        write_dependencies: True

      # This version specifies files as explicit list, which allows to
      # define file-specific parameters.
      files:
        - "*"
        - test3.f90:
            offload: False
        - test2.f90:
        - test1.f90:
            offload: True

    # If a script is repeated, this will change the default parameter for all
    # files listed. The full set of default parameters will be taken from the
    # first time the script is mentioned. No new parameter (i.e. one that is
    # not listed in the first instance of the script) can be added
    - script: global.py
      params:
        offload: False
      files: test4.f90 test5.f90

    # This is a shortcut showing that files can be specified as a single
    # string with space-separated file names. This is the same as an explicit
    # list, but without the ability to specify file-specific parameters.
    - script: local1.py
      params:
        offload: False
        write_dependencies: False

      files: "a.f90 b.f90
             c.f90"

    # This version uses an explicit list and no parameters:
    - script: local2.py
      params:
        view_schedule: False

      files:
        - a.f90
        - b.f90
        - c.f90

    # Use a list in flow style and no parameters
    - script: local3.py
      params:
        view_schedule: False

      files: [a.f90, b.f90, c.f90]

    # This represents existing functionality: if there is a file-specific .py
    # file, use it. The specification of '*' does not trigger an error
    # if there is no file_specific script (while explicitly putting a name
    # in the file list will trigger an error if the corresponding PSyclone
    # script does not exist. This way, errors are caught early).
    - file_specific:
        params:
          offload: True
          view_schedule: False

        files:
          - "*":
              offload: False
          - somefile.f90:
              offload: True
