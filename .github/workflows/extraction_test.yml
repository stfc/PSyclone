# This workflow will use a self-hosted runner to perform the more expensive
# integrations tests that are not run on GHA systems.

name: LFRic Extraction Tests

on:
  push

jobs:
  run_if_on_mirror:
    if: ${{ github.repository == 'stfc/PSyclone-mirror' }}
    runs-on: self-hosted
    env:
      # For now hard-core the CORE branch, till all the Fab
      # PRs are properly merged in.
      LFRIC_CORE_HASH: 458_mesh_for_mesh_tools
      LFRIC_APPS_HASH: 741_more_fab_scripts
      GNU_TOOLCHAIN: gnu14_openmpi
      PYTHON_VERSION: "3.13"
      NUM_PARALLEL: 6
      RUNDIR: "/archive/psyclone-tests/latest-run"

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
        # This is required to get the commit history for merge commits for
        # the ci-skip check below.
        fetch-depth: '0'
    - name: Check for [skip ci] in commit message
      uses: mstachniuk/ci-skip@v1
      with:
        # This setting causes the tests to 'fail' if [skip ci] is specified
        fail-fast: true
        commit-filter: '[skip ci]'
    - name: Install dependencies
      run: |
        # Use a specific version of Python (rather than the system-wide one).
        module load python/${PYTHON_VERSION}
        python -m venv .runner_venv
        . .runner_venv/bin/activate

        python -m pip install --upgrade pip
        # Uncomment the below to use the submodule version of fparser rather
        # than the latest release from pypi.
        # pip install external/fparser
        pip install .[test]
        export PSYCLONE_ROOT=${PWD}

        # Create the new Fortran files, i.e. processing with Jinja2
        pushd lib/extract/netcdf/lfric
        make read_kernel_data_mod.f90 compare_variables_mod.F90 \
             extract_netcdf_base.F90 kernel_data_netcdf.f90 psy_data_base.f90 \
             read_kernel_data_mod.f90
        # Keep the location of the extraction source files
        export PSYCLONE_EXTRACT_DIR=${PWD}
        popd

        cd ${RUNDIR}
        rm -rf lfric_extraction
        mkdir lfric_extraction
        cd lfric_extraction

        # Checkout and install Fab:
        # -------------------------
        # For now hard-code a branch
        git clone -b fab_for_lfric_apps_specific https://github.com/MetOffice/fab.git
        pushd fab
        pip install .
        popd

        # Checkout LFRic apps, then core:
        # -------------------------------
        # For now, until all Fab PRs are merged, hard-code the branch we need
        # git clone https://github.com/MetOffice/lfric_apps.git
        git clone git@github.com:hiker/lfric_apps.git
        pushd lfric_apps
        git checkout ${LFRIC_APPS_HASH}
        # Always use https - that doesn't work for me, even though
        # it does in lfric_test.yml :(
        # git config --global url."https://github.com/" insteadgit@github.com:hiker/lfric_core.gitOf git@github.com:
        popd

        # Checkout core:
        # This script will checkout the version specified in dependencies.yaml
        #./lfric_apps/build/fetch_core.py lfric_apps/dependencies.yaml lfric_core

        # For now, until all Fab PRs are merged, hard-code the branch we need,
        # and just use git clone
        git clone git@github.com:hiker/lfric_core.git
        pushd lfric_core
        git checkout ${LFRIC_CORE_HASH}
        popd

        # Copy scripts and PSyData files into the LFRic sources:
        # ------------------------------------------------------
        cp ${PSYCLONE_ROOT}/.github/workflows/fab_scripts/extract_mixin.py \
          lfric_core/lfric_build
        cp ${PSYCLONE_ROOT}/.github/workflows/fab_scripts/fab_gungho_model_extract.py \
            lfric_apps/applications/gungho_model/
        mkdir -p lfric_apps/applications/gungho_model/optimisation/extract
        cp ${PSYCLONE_ROOT}/.github/workflows/fab_scripts/global.py \
            lfric_apps/applications/gungho_model/optimisation/extract

        # Copy the extract PSyData files into the LFRic Fab build system:
        mkdir -p lfric_core/infrastructure/build/psyclone/psydata/extract
        cp ${PSYCLONE_EXTRACT_DIR}/*90 lfric_core/infrastructure/build/psyclone/psydata/extract

        # Is this still required?
        sed -i "s|use_xios_io=.true.|use_xios_io=.false.|g" lfric_apps/applications/gungho_model/example/configuration.nml

    # Compile GungHo with extraction
    - name: GungHo Extraction Compilation
      run:  |
        # Set up environment
        source /archive/psyclone-spack/psyclone-spack-Dec25/spack-repo/share/spack/setup-env.sh
        spack load lfric-build-environment %${GNU_TOOLCHAIN}
        source .runner_venv/bin/activate
        export COMPILER_PROFILE=fast-debug
        export NUM_PROCS=6
        export MAX_PROC=$((NUM_PROCS-1))

        # Set the directory names for the extraction runs:
        # -----------------------------------------------
        export LFRIC_CORE=${RUNDIR}/lfric_extraction/lfric_core
        export LFRIC_APPS=${RUNDIR}/lfric_extraction/lfric_apps

        # Build GungHo with the BAF extraction script
        # -------------------------------------------
        cd ${LFRIC_APPS}/applications/gungho_model
        export FAB_WORKSPACE=$PWD/fab_workspace
        mkdir -p ${FAB_WORKSPACE}
        # Run the Fab build script
        echo "PP ${PYTHONPATH}"
        echo "PWD ${PWD}"
        echo "DIRS ${LFRIC_CORE} ${LFRIC_APPS}"
        ls

        echo "COMMAND IS ./fab_gungho_model_extract.py --core ${LFRIC_CORE}      \
          --fab-workspace ${FAB_WORKSPACE}                      \
          --profile ${COMPILER_PROFILE} --nproc ${NUM_PARALLEL} \
          -fc $LDMPI -ld $LDMPI -cc $CC"

        ./fab_gungho_model_extract.py --core ${LFRIC_CORE}      \
          --fab-workspace ${FAB_WORKSPACE}                      \
          --profile ${COMPILER_PROFILE} --nproc ${NUM_PARALLEL} \
          -fc $LDMPI -ld $LDMPI -cc $CC

        # Run gungho (which will create the NetCDF kernel data files)
        # -----------------------------------------------------------
        # Modify number of timesteps to reduce impact on system
        cd example
        sed -i "s/timestep_end='10'/timestep_end='1'/" configuration.nml
        mpirun -n ${NUM_PROCS} ${FAB_WORKSPACE}/gungho_model_extract-${COMPILER_PROFILE}-mpif90-gfortran/gungho_model configuration.nml

        # Now compile a subset of the drivers
        # -----------------------------------

        cd ..

        compile_count=0

        # `name` is the 'basic' name. A driver file is then called driver-$FILE.F90, and
        # the kernel data files are called $FILE-$RANK.nc
        for name in sci_fem_constants_mod_psy-invoke_compute_w1_mass_matrix-compute_mass_matrix_w1_code-r0; do

          # We link with yaxt, since a few drivers inline a module that contains yaxt
          # functions (though these functions and therefore yaxt are not actually used
          # during the execution of the driver)
          mpif90 driver-${name}.F90 $FFLAGS $LDFLAGS -l yaxt_c -o driver-${name}
          compile_count=$((compile_count+1 ))
        done

        run_count=0
        all_files="sci_fem_constants_mod_psy-invoke_compute_w1_mass_matrix-compute_mass_matrix_w1_code-r0"
        for name in $all_files; do
          # Execute the driver for each kernel data file,
          # which will print results to the screen
          # ---------------------------------------------
          for proc in $(seq 0 $MAX_PROC); do
            echo "Executing driver-${name} for ${proc}"
            ./driver-${name} ./example/${name}-${proc}.nc
            run_count=$((run_count+1))
          done
        done

        NUM_NC_FILES=$(ls example/*-[0-${MAX_PROC}].nc|wc -w)
        KERNEL_DATA=$((NUM_NC_FILES / NUM_PROCS))
        echo "Drivers created:   $(ls driver*F90|wc -w)"
        echo "Kernel data files: $NUM_NC_FILES"
        echo "Unique Kernels:    $((NUM_NC_FILES/NUM_PROCS))"
        echo "Drivers compiled:  ${compile_count}"
        echo "Drivers executed:  ${run_count}"
